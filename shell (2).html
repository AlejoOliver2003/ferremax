<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProspectAI</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563EB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ProspectAI">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="ProspectAI">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --negro:#111318;--negro-m:#1C1F26;--negro-c:#252830;--negro-b:#2A2D35;
  --blanco:#F0EEE9;--blanco-d:#9CA3AF;
  --azul:#2563EB;--azul-l:#3B82F6;--azul-xl:#93C5FD;
  --verde:#22C55E;--rojo:#EF4444;--naranja:#F59E0B;
  --sidebar-w:220px;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:var(--negro);color:var(--blanco);display:flex}

/* ── SIDEBAR ── */
.sidebar{
  width:var(--sidebar-w);background:var(--negro-m);
  border-right:1px solid rgba(240,238,233,.06);
  display:flex;flex-direction:column;flex-shrink:0;
  height:100vh;position:fixed;top:0;left:0;z-index:200;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.sidebar.collapsed{transform:translateX(-100%)}

.sidebar-logo{padding:20px 18px;border-bottom:1px solid rgba(240,238,233,.06);display:flex;align-items:center;gap:10px}
.logo-mark{width:32px;height:32px;background:var(--azul);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:14px;color:white;flex-shrink:0}
.logo-txt{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:var(--blanco);line-height:1}
.logo-sub{font-size:9px;color:var(--blanco-d);font-family:'DM Mono',monospace;letter-spacing:.1em;margin-top:1px}

.sidebar-empresa{padding:12px 18px;border-bottom:1px solid rgba(240,238,233,.06)}
.empresa-pill{display:flex;align-items:center;gap:8px;background:var(--negro-c);border-radius:6px;padding:8px 10px;cursor:pointer;transition:background .15s}
.empresa-pill:hover{background:var(--negro-b)}
.empresa-avatar{width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:700;font-size:11px;color:white;flex-shrink:0;background:var(--azul)}
.empresa-nombre{font-size:12px;font-weight:600;color:var(--blanco);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empresa-plan{font-size:9px;font-family:'DM Mono',monospace;color:var(--azul-xl);background:rgba(37,99,235,.15);padding:2px 6px;border-radius:3px;flex-shrink:0}

.sidebar-nav{flex:1;padding:10px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.sidebar-nav::-webkit-scrollbar{width:0}
.nav-section{font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(240,238,233,.25);padding:12px 8px 5px;font-family:'DM Mono',monospace}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:6px;cursor:pointer;transition:all .15s;font-size:13px;font-weight:500;color:var(--blanco-d);border:none;background:none;width:100%;text-align:left;font-family:'Inter',sans-serif;position:relative}
.nav-item:hover{background:var(--negro-c);color:var(--blanco)}
.nav-item.active{background:rgba(37,99,235,.15);color:var(--azul-xl);font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;background:var(--azul);border-radius:0 2px 2px 0}
.nav-ico{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--azul);color:white;border-radius:10px;font-size:9px;font-weight:700;padding:1px 6px;font-family:'DM Mono',monospace}

.sidebar-bottom{padding:12px 10px;border-top:1px solid rgba(240,238,233,.06)}
.user-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:6px;cursor:pointer;transition:background .15s}
.user-item:hover{background:var(--negro-c)}
.user-avatar{width:28px;height:28px;border-radius:50%;background:var(--azul);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:700;font-size:11px;color:white;flex-shrink:0}
.user-name{font-size:12px;font-weight:600;color:var(--blanco)}
.user-role{font-size:10px;color:var(--blanco-d)}
.nav-item.logout{color:var(--rojo);margin-top:4px}
.nav-item.logout:hover{background:rgba(239,68,68,.1)}

/* ── MAIN AREA ── */
.main-area{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;height:100vh;transition:margin-left .3s}
.main-area.expanded{margin-left:0}

/* TOPBAR */
.topbar{background:var(--negro-m);border-bottom:1px solid rgba(240,238,233,.06);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:100}
.topbar-left{display:flex;align-items:center;gap:12px}
.btn-toggle{background:none;border:none;color:var(--blanco-d);cursor:pointer;font-size:18px;padding:4px;border-radius:4px;transition:all .15s;line-height:1}
.btn-toggle:hover{background:var(--negro-c);color:var(--blanco)}
.topbar-title{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;color:var(--blanco)}
.topbar-breadcrumb{font-size:11px;color:var(--blanco-d);font-family:'DM Mono',monospace}
.topbar-right{display:flex;align-items:center;gap:8px}
.topbar-search{background:var(--negro-c);border:1px solid rgba(240,238,233,.08);border-radius:6px;padding:6px 12px;color:var(--blanco);font-family:'Inter',sans-serif;font-size:12px;outline:none;width:180px;transition:all .2s}
.topbar-search::placeholder{color:rgba(240,238,233,.3)}
.topbar-search:focus{border-color:var(--azul);width:220px}
.topbar-btn{background:var(--negro-c);border:1px solid rgba(240,238,233,.08);border-radius:6px;padding:6px 10px;color:var(--blanco-d);cursor:pointer;font-size:14px;transition:all .15s;line-height:1}
.topbar-btn:hover{background:var(--negro-b);color:var(--blanco)}
.notif-wrap{position:relative}
.notif-dot{position:absolute;top:4px;right:4px;width:7px;height:7px;background:var(--rojo);border-radius:50%;border:1.5px solid var(--negro-m)}

/* NOTIF PANEL */
.notif-panel{position:absolute;top:44px;right:0;width:300px;background:var(--negro-m);border:1px solid rgba(240,238,233,.1);border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.4);z-index:300;display:none}
.notif-panel.open{display:block}
.notif-header{padding:12px 16px;border-bottom:1px solid rgba(240,238,233,.06);display:flex;justify-content:space-between;align-items:center}
.notif-title{font-family:'Syne',sans-serif;font-weight:700;font-size:13px}
.notif-clear{font-size:11px;color:var(--azul-xl);cursor:pointer;background:none;border:none;font-family:'Inter',sans-serif}
.notif-list{max-height:300px;overflow-y:auto}
.notif-item{padding:12px 16px;border-bottom:1px solid rgba(240,238,233,.04);display:flex;gap:10px;cursor:pointer;transition:background .1s}
.notif-item:hover{background:var(--negro-c)}
.notif-item.unread{background:rgba(37,99,235,.05)}
.notif-ico{font-size:16px;flex-shrink:0;margin-top:1px}
.notif-txt{font-size:12px;color:var(--blanco-d);line-height:1.4}
.notif-txt strong{color:var(--blanco)}
.notif-time{font-size:10px;color:rgba(240,238,233,.3);font-family:'DM Mono',monospace;margin-top:3px}

/* IFRAME CONTENT */
.iframe-wrap{flex:1;position:relative;overflow:hidden}
#content-frame{width:100%;height:100%;border:none;background:var(--negro)}

/* LOADING OVERLAY */
.loading-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--negro);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;transition:opacity .3s}
.loading-overlay.hidden{opacity:0;pointer-events:none}
.loading-spinner{width:36px;height:36px;border:3px solid rgba(240,238,233,.1);border-top-color:var(--azul);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:13px;color:var(--blanco-d);font-family:'DM Mono',monospace}

/* MOBILE OVERLAY */
.sidebar-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:190}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.mobile-open{transform:translateX(0)}
  .main-area{margin-left:0!important}
  .sidebar-overlay{display:none}
  .sidebar-overlay.show{display:block}
  .topbar-search{display:none}
}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--negro-m);border:1px solid var(--verde);border-radius:6px;padding:10px 18px;font-size:12px;font-weight:600;color:var(--blanco);z-index:999;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<!-- SIDEBAR OVERLAY (mobile) -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-mark">P</div>
    <div>
      <div class="logo-txt">ProspectAI</div>
      <div class="logo-sub">SISTEMA DE PROSPECCIÓN</div>
    </div>
  </div>

  <div class="sidebar-empresa">
    <div class="empresa-pill" onclick="navegar('onboarding.html','Configuración')">
      <div class="empresa-avatar" id="emp-avatar">FM</div>
      <div>
        <div class="empresa-nombre" id="emp-nombre">FerreMax</div>
        <div class="empresa-plan">Business</div>
      </div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-section">Principal</div>
    <button class="nav-item active" id="nav-prospector" onclick="navegar('index.html','Prospector','🔍 Prospector')">
      <span class="nav-ico">🔍</span> Prospector
    </button>

    <div class="nav-section">Gestión</div>
    <button class="nav-item" id="nav-admin" onclick="navegar('admin.html','Dashboard','📊 Dashboard')">
      <span class="nav-ico">📊</span> Dashboard
    </button>
    <button class="nav-item" id="nav-crm" onclick="navegar('crm.html','CRM de Clientes','👥 CRM')">
      <span class="nav-ico">👥</span> CRM de Clientes
      <span class="nav-badge" id="badge-crm">8</span>
    </button>
    <button class="nav-item" id="nav-vendedores" onclick="navegarSeccion('admin.html','vendedores','👥 Vendedores')">
      <span class="nav-ico">👥</span> Vendedores
    </button>
    <button class="nav-item" id="nav-prospectos" onclick="navegarSeccion('admin.html','prospectos','🎯 Prospectos')">
      <span class="nav-ico">🎯</span> Prospectos
      <span class="nav-badge" id="badge-prospectos">12</span>
    </button>

    <div class="nav-section">Análisis</div>
    <button class="nav-item" id="nav-reportes" onclick="navegarSeccion('admin.html','reportes','📈 Reportes')">
      <span class="nav-ico">📈</span> Reportes
    </button>
    <button class="nav-item" id="nav-zonas" onclick="navegarSeccion('admin.html','zonas','🗺️ Zonas')">
      <span class="nav-ico">🗺️</span> Zonas
    </button>
    <button class="nav-item" id="nav-metas" onclick="navegar('metas.html','Metas y Objetivos','🎯 Metas')">
      <span class="nav-ico">🎯</span> Metas y Objetivos
    </button>
    <button class="nav-item" id="nav-comisiones" onclick="navegar('comisiones.html','Calculadora de Comisiones','💰 Comisiones')">
      <span class="nav-ico">💰</span> Comisiones
    </button>

    <div class="nav-section">Sistema</div>
    <button class="nav-item" id="nav-onboarding" onclick="navegar('onboarding.html','Configuración','⚙️ Configuración')">
      <span class="nav-ico">⚙️</span> Configuración
    </button>
    <button class="nav-item" id="nav-landing" onclick="navegar('landing.html','Landing Page','🌐 Landing Page')">
      <span class="nav-ico">🌐</span> Landing page
    </button>
  </nav>

  <div class="sidebar-bottom">
    <div class="user-item">
      <div class="user-avatar">AP</div>
      <div>
        <div class="user-name">Alejo Paz</div>
        <div class="user-role">Administrador</div>
      </div>
    </div>
    <button class="nav-item logout" onclick="cerrarSesion()">
      <span class="nav-ico">🚪</span> Cerrar sesión
    </button>
  </div>
</div>

<!-- MAIN AREA -->
<div class="main-area" id="mainArea">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-left">
      <button class="btn-toggle" onclick="toggleSidebar()" title="Menú">☰</button>
      <div>
        <div class="topbar-title" id="topbar-title">Prospector</div>
        <div class="topbar-breadcrumb">ProspectAI / <span id="topbar-breadcrumb">Prospector</span></div>
      </div>
    </div>
    <div class="topbar-right">
      <input type="text" class="topbar-search" placeholder="🔍 Buscar…">
      <div class="notif-wrap">
        <button class="topbar-btn" onclick="toggleNotif()" title="Notificaciones">🔔
          <div class="notif-dot" id="notifDot"></div>
        </button>
        <div class="notif-panel" id="notifPanel">
          <div class="notif-header">
            <span class="notif-title">Notificaciones</span>
            <button class="notif-clear" onclick="limpiarNotifs()">Marcar todo como leído</button>
          </div>
          <div class="notif-list" id="notifList"></div>
        </div>
      </div>
      <button class="topbar-btn" id="btn-instalar" style="display:none;background:rgba(37,99,235,.15);color:var(--azul-xl);border-color:rgba(37,99,235,.3)" onclick="instalarApp()" title="Instalar app">📲 Instalar</button>
      <button class="topbar-btn" onclick="toggleFullscreen()" title="Pantalla completa">⛶</button>
    </div>
  </div>

  <!-- IFRAME -->
  <div class="iframe-wrap">
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loading-spinner"></div>
      <div class="loading-txt">Cargando…</div>
    </div>
    <iframe id="content-frame" src="index.html" onload="onFrameLoad()"></iframe>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── ESTADO ──
let sidebarAbierto = true;
let notifAbierto = false;
let seccionPendiente = null;

const NOTIFICACIONES = [
  {ico:'✅',texto:'<strong>Lucas M.</strong> cerró venta con Ferretería El Maestro',time:'Hace 2 horas',leida:false},
  {ico:'🎯',texto:'<strong>Carla R.</strong> asignó 5 nuevos prospectos en La Matanza',time:'Hace 3 horas',leida:false},
  {ico:'💬',texto:'<strong>Martín G.</strong> generó mensaje para Mayorista Avellaneda',time:'Hace 5 horas',leida:true},
  {ico:'📊',texto:'Reporte semanal disponible — 284 prospectos este mes',time:'Ayer 09:00',leida:true},
  {ico:'🆕',texto:'<strong>Ana P.</strong> agregó 3 prospectos nuevos en Lomas',time:'Ayer 16:30',leida:true},
];

// ── NAVEGACIÓN ──
function navegar(url, titulo, breadcrumb) {
  const frame = document.getElementById('content-frame');
  const overlay = document.getElementById('loadingOverlay');

  // Mostrar loading
  overlay.classList.remove('hidden');

  // Actualizar topbar
  document.getElementById('topbar-title').textContent = titulo || url;
  document.getElementById('topbar-breadcrumb').textContent = breadcrumb || titulo || url;

  // Actualizar nav activo
  actualizarNavActivo(url);

  // Guardar sección pendiente si viene de admin
  seccionPendiente = null;

  // Cargar iframe
  frame.src = url;

  // Cerrar sidebar en mobile
  if(window.innerWidth <= 768) toggleSidebar(false);
}

function navegarSeccion(url, seccion, breadcrumb) {
  seccionPendiente = seccion;
  navegar(url, breadcrumb, breadcrumb);
}

function actualizarNavActivo(url) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const map = {
    'index.html':'nav-prospector',
    'admin.html':'nav-admin',
    'crm.html':'nav-crm',
    'metas.html':'nav-metas',
    'comisiones.html':'nav-comisiones',
    'onboarding.html':'nav-onboarding',
    'landing.html':'nav-landing',
  };
  const id = map[url];
  if(id) document.getElementById(id)?.classList.add('active');
}

function onFrameLoad() {
  const overlay = document.getElementById('loadingOverlay');
  overlay.classList.add('hidden');

  // Si hay sección pendiente, intentar navegar dentro del admin
  if(seccionPendiente) {
    try {
      const frameDoc = document.getElementById('content-frame').contentWindow;
      if(frameDoc && frameDoc.setVista) {
        // Encontrar el botón correcto y activarlo
        const btns = frameDoc.document.querySelectorAll('.nav-item');
        btns.forEach(b => {
          if(b.textContent.toLowerCase().includes(seccionPendiente.toLowerCase())) {
            frameDoc.setVista(seccionPendiente, b);
          }
        });
        frameDoc.setVista(seccionPendiente, null);
      }
    } catch(e) { /* cross-origin — ignorar */ }
    seccionPendiente = null;
  }
}

// ── SIDEBAR TOGGLE ──
function toggleSidebar(forzar) {
  const sb = document.getElementById('sidebar');
  const main = document.getElementById('mainArea');
  const overlay = document.getElementById('sidebarOverlay');

  if(window.innerWidth <= 768) {
    const abierto = sb.classList.contains('mobile-open');
    const nuevoEstado = forzar !== undefined ? forzar : !abierto;
    sb.classList.toggle('mobile-open', nuevoEstado);
    overlay.classList.toggle('show', nuevoEstado);
  } else {
    sidebarAbierto = forzar !== undefined ? forzar : !sidebarAbierto;
    sb.classList.toggle('collapsed', !sidebarAbierto);
    main.classList.toggle('expanded', !sidebarAbierto);
  }
}

// ── NOTIFICACIONES ──
function renderNotifs() {
  const list = document.getElementById('notifList');
  const sinLeer = NOTIFICACIONES.filter(n => !n.leida).length;
  document.getElementById('notifDot').style.display = sinLeer ? 'block' : 'none';
  list.innerHTML = NOTIFICACIONES.map((n,i) => `
    <div class="notif-item ${n.leida?'':'unread'}" onclick="marcarLeida(${i})">
      <div class="notif-ico">${n.ico}</div>
      <div>
        <div class="notif-txt">${n.texto}</div>
        <div class="notif-time">${n.time}</div>
      </div>
    </div>`).join('');
}

function toggleNotif() {
  const panel = document.getElementById('notifPanel');
  notifAbierto = !notifAbierto;
  panel.classList.toggle('open', notifAbierto);
  if(notifAbierto) renderNotifs();
}

function marcarLeida(idx) {
  NOTIFICACIONES[idx].leida = true;
  renderNotifs();
}

function limpiarNotifs() {
  NOTIFICACIONES.forEach(n => n.leida = true);
  renderNotifs();
  mostrarToast('✓ Notificaciones marcadas como leídas');
}

// Cerrar notif al click afuera
document.addEventListener('click', e => {
  const panel = document.getElementById('notifPanel');
  const btn = e.target.closest('.notif-wrap');
  if(!btn && notifAbierto) {
    notifAbierto = false;
    panel.classList.remove('open');
  }
});

// ── FULLSCREEN ──
function toggleFullscreen() {
  if(!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

// ── EMPRESA (desde localStorage) ──
function cargarEmpresa() {
  const nombre = localStorage.getItem('pai-empresa') || 'Mi Empresa';
  const ini = nombre.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  document.getElementById('emp-nombre').textContent = nombre;
  document.getElementById('emp-avatar').textContent = ini;
}

// ── CERRAR SESIÓN ──
function cerrarSesion() {
  if(confirm('¿Seguro que querés cerrar sesión?')) {
    mostrarToast('👋 Hasta pronto');
    setTimeout(() => window.location.href = 'landing.html', 1200);
  }
}

// ── TOAST ──
function mostrarToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── PWA: REGISTRO SERVICE WORKER ──
let deferredPrompt = null;

if('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => {
        console.log('[PWA] Service Worker registrado:', reg.scope);

        // Detectar actualización disponible
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if(newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              mostrarBannerActualizacion();
            }
          });
        });
      })
      .catch(err => console.warn('[PWA] Error al registrar SW:', err));
  });
}

// Capturar el evento de instalación
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  // Mostrar botón de instalación
  const btn = document.getElementById('btn-instalar');
  if(btn) btn.style.display = 'flex';
});

// Cuando se instala exitosamente
window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  const btn = document.getElementById('btn-instalar');
  if(btn) btn.style.display = 'none';
  mostrarToast('🎉 ProspectAI instalado correctamente');
});

function instalarApp() {
  if(!deferredPrompt) {
    mostrarToast('ℹ️ Usá el menú del navegador para instalar');
    return;
  }
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(result => {
    if(result.outcome === 'accepted') {
      mostrarToast('✓ Instalando ProspectAI…');
    }
    deferredPrompt = null;
    document.getElementById('btn-instalar').style.display = 'none';
  });
}

function mostrarBannerActualizacion() {
  const banner = document.createElement('div');
  banner.style.cssText = `
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--negro-m);border:1px solid var(--azul);border-radius:8px;
    padding:12px 20px;display:flex;align-items:center;gap:12px;
    z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.4);font-size:13px;
    font-family:'Inter',sans-serif;color:var(--blanco);white-space:nowrap;
  `;
  banner.innerHTML = `
    <span>🔄 Nueva versión disponible</span>
    <button onclick="window.location.reload()" style="background:var(--azul);color:white;border:none;border-radius:5px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif">Actualizar</button>
    <button onclick="this.parentElement.remove()" style="background:none;border:none;color:var(--blanco-d);cursor:pointer;font-size:16px;line-height:1">✕</button>
  `;
  document.body.appendChild(banner);
}

// ── INIT ──
cargarEmpresa();
renderNotifs();

// Responsive: colapsar sidebar automáticamente en pantallas chicas
if(window.innerWidth <= 768) {
  document.getElementById('sidebar').classList.remove('collapsed');
}
</script>
